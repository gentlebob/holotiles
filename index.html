<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Conference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Conference is a relative-positioned canvas; all players float inside it */
    #conference {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
    }

    /* Each player container is absolutely positioned; JS moves it via left/top/width/height.
       CSS transitions animate the movement so swaps look smooth instead of jarring. */
    .player-container {
      position: absolute;
      background: #161616;
      border: 1px solid #262626;
      border-radius: 0;
      overflow: hidden;
      outline: 2px solid transparent;
      outline-offset: -2px;
      transition:
        left   0.12s cubic-bezier(0.4, 0, 0.2, 1),
        top    0.12s cubic-bezier(0.4, 0, 0.2, 1),
        width  0.12s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.12s cubic-bezier(0.4, 0, 0.2, 1),
        outline-color 0.05s,
        border-color 0.05s;
    }

    .player-container.is-main {
      border-color: #0f62fe;
      outline-color: #0f62fe;
    }

    .player-container:not(.is-main):hover {
      outline-color: #0f62fe;
      border-color: #0f62fe;
    }

    /* Player wrap fills the container so the iframe resizes with it */
    .player-wrap {
      width: 100%;
      height: 100%;
    }

    .player-wrap iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }

    /* Transparent overlay blocks all YouTube UI and captures clicks */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
    }

    .player-container.is-main > .overlay {
      cursor: default;
    }

    /* Title label at the bottom of each tile — solid charcoal bar (Carbon resists gradients) */
    .video-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 12px;
      background: #161616;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.33;
      letter-spacing: 0.32px;
      color: #ffffff;
      z-index: 12;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* Mute badge shown on secondary tiles — flat charcoal chip */
    .mute-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 13;
      font-size: 12px;
      line-height: 1;
      color: #ffffff;
      background: #161616;
      padding: 4px 6px;
      border-radius: 0;
      pointer-events: none;
    }

    /* Mute toggle — Carbon button-primary: IBM Blue, square, 12/16 padding */
    #mute-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      background: #0f62fe;
      border: 1px solid #0f62fe;
      border-radius: 0;
      color: #ffffff;
      padding: 12px 16px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.29;
      letter-spacing: 0.16px;
      transition: background-color 0.11s, border-color 0.11s;
      user-select: none;
      display: none;
    }

    #mute-btn:hover { background: #0050e6; border-color: #0050e6; }
    #mute-btn:active { background: #002d9c; border-color: #002d9c; }
    #mute-btn:focus-visible {
      outline: 2px solid #0f62fe;
      outline-offset: 2px;
    }

    /* Loading / error screen — black canvas with inverse-ink type */
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #000000;
      color: #ffffff;
      z-index: 100;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.16px;
      line-height: 1.5;
    }

    #status.hidden { display: none; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #262626;
      border-top-color: #0f62fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Custom strip scrollbar — Carbon gray-60 thumb on the strip edge */
    #strip-indicator {
      position: absolute;
      background: #6f6f6f;
      pointer-events: none;
      display: none;
      z-index: 20;
      border-radius: 0;
      transition: opacity 0.15s;
    }
  </style>
</head>
<body>

<div id="status">
  <div class="spinner"></div>
  <span id="status-text">Loading videos…</span>
</div>

<div id="conference"></div>
<button id="mute-btn" title="Toggle mute">🔇</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const API_URL  = 'https://holotiles.stash.gentlebob.com/livestreams2';
const PAD      = 16;  // px padding around the conference area (Carbon spacing.md)
const GAP      = 8;   // px gap between tiles (Carbon spacing.xs)

// ─────────────────────────────────────────────
// MOCK — swap fetchVideos() body for a real fetch() when backend is ready.
// Expected JSON: [ { "id": "YOUTUBE_ID", "title": "..." }, … ]
// ─────────────────────────────────────────────
async function fetchVideos() {
  const res = await fetch(API_URL);
  if (!res.ok) throw new Error(`API returned ${res.status}`);
  return res.json();
}

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let videos       = [];  // [{id, title}] from API
let players      = [];  // YT.Player[i] — never reordered
let containers   = [];  // HTMLElement[i] — player wrapper divs, never reordered
let positionOrder = []; // positionOrder[slot] = playerIndex; slot 0 = main
let mainMuted    = false;
let ytReady      = false;
let pendingInit  = false;
let stripScroll  = 0;     // px scroll offset within the secondary strip
let stripBounds  = null;  // { x, y, w, h, axis: 'y'|'x', maxScroll }

// ─────────────────────────────────────────────
// YOUTUBE API CALLBACK
// ─────────────────────────────────────────────
window.onYouTubeIframeAPIReady = () => {
  ytReady = true;
  if (pendingInit) buildPlayers();
};

// ─────────────────────────────────────────────
// BOOTSTRAP
// ─────────────────────────────────────────────
(async () => {
  try {
    videos = await fetchVideos();
    if (!videos.length) throw new Error('No videos returned from API.');
    positionOrder = videos.map((_, i) => i); // [0, 1, 2, ...]

    if (ytReady) buildPlayers();
    else pendingInit = true;
  } catch (err) {
    document.getElementById('status-text').textContent = `Error: ${err.message}`;
    document.querySelector('.spinner').style.display = 'none';
  }
})();

// ─────────────────────────────────────────────
// BUILD DOM + PLAYERS
// All containers are created once and never moved in the DOM.
// Layout is applied purely via CSS left/top/width/height.
// ─────────────────────────────────────────────
function buildPlayers() {
  const conf = document.getElementById('conference');

  for (let i = 0; i < videos.length; i++) {
    // Container div — this never moves in the DOM
    const container = document.createElement('div');
    container.className = 'player-container';
    container.id = `container-${i}`;

    // Player target div
    const playerDiv = document.createElement('div');
    playerDiv.className = 'player-wrap';
    const playerTarget = document.createElement('div');
    playerTarget.id = `yt-player-${i}`;
    playerDiv.appendChild(playerTarget);
    container.appendChild(playerDiv);

    // Overlay — intercepts clicks on the YouTube iframe
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.addEventListener('click', () => onPlayerClick(i));
    container.appendChild(overlay);

    // Title label
    const label = document.createElement('div');
    label.className = 'video-label';
    label.id = `label-${i}`;
    label.textContent = videos[i].title;
    container.appendChild(label);

    // Mute badge (hidden on main)
    const badge = document.createElement('div');
    badge.className = 'mute-badge';
    badge.id = `badge-${i}`;
    badge.textContent = '🔇';
    container.appendChild(badge);

    conf.appendChild(container);
    containers.push(container);

    // Create YT player
    players.push(new YT.Player(`yt-player-${i}`, {
      width: '100%',
      height: '100%',
      videoId: videos[i].id,
      playerVars: { controls: 0, disablekb: 1, modestbranding: 1, rel: 0, autoplay: 1, mute: 1 },
      events: {
        onReady(e) { e.target.mute(); e.target.playVideo(); },
      },
    }));
  }

  // Strip scroll indicator (Carbon-style flat thumb)
  const indicator = document.createElement('div');
  indicator.id = 'strip-indicator';
  conf.appendChild(indicator);

  // Wire up mute button
  const muteBtn = document.getElementById('mute-btn');
  muteBtn.style.display = 'block';
  muteBtn.addEventListener('click', toggleMainMute);

  // Wire up strip scroll (wheel + touch)
  conf.addEventListener('wheel', onWheel, { passive: false });
  conf.addEventListener('touchstart', onTouchStart, { passive: true });
  conf.addEventListener('touchmove', onTouchMove, { passive: false });
  conf.addEventListener('touchend', onTouchEnd);
  conf.addEventListener('touchcancel', onTouchEnd);

  // Show the conference, hide the loading screen
  document.getElementById('status').classList.add('hidden');

  // Initial layout + listen for window resize
  applyLayout();
  new ResizeObserver(applyLayout).observe(document.getElementById('conference'));
}

// ─────────────────────────────────────────────
// LAYOUT — calculates rects for every slot and
// applies them to containers via CSS properties.
// DOM order never changes; only CSS values change.
// ─────────────────────────────────────────────
function calculateRects(W, H) {
  const n = videos.length;
  const secCount = n - 1;

  // Landscape: main left, secondary strip on right
  if (W >= H) {
    const stripW  = Math.round(Math.min(Math.max(W * 0.22, 160), 280));
    const mainW   = W - PAD * 2 - GAP - stripW;
    const mainH   = H - PAD * 2;
    const mainRect = { x: PAD, y: PAD, w: mainW, h: mainH };

    const secW = stripW;
    const secH = Math.round(secW * 9 / 16);
    const stripX = PAD + mainW + GAP;
    const stripY = PAD;
    const stripVisH = H - PAD * 2;
    const totalH = secCount * secH + Math.max(0, secCount - 1) * GAP;
    const maxScroll = Math.max(0, totalH - stripVisH);
    stripScroll = Math.max(0, Math.min(stripScroll, maxScroll));
    stripBounds = { x: stripX, y: stripY, w: stripW, h: stripVisH, axis: 'y', maxScroll };

    const secRects = [];
    for (let s = 0; s < secCount; s++) {
      secRects.push({
        x: stripX,
        y: stripY + s * (secH + GAP) - stripScroll,
        w: secW,
        h: secH,
      });
    }
    return [mainRect, ...secRects];
  }

  // Portrait: main top, secondary strip on bottom
  const stripH  = Math.round(Math.min(Math.max(H * 0.22, 90), 180));
  const mainW   = W - PAD * 2;
  const mainH   = H - PAD * 2 - GAP - stripH;
  const mainRect = { x: PAD, y: PAD, w: mainW, h: mainH };

  const secH = stripH;
  const secW = Math.round(secH * 16 / 9);
  const stripX = PAD;
  const stripY = PAD + mainH + GAP;
  const stripVisW = W - PAD * 2;
  const totalW = secCount * secW + Math.max(0, secCount - 1) * GAP;
  const maxScroll = Math.max(0, totalW - stripVisW);
  stripScroll = Math.max(0, Math.min(stripScroll, maxScroll));
  stripBounds = { x: stripX, y: stripY, w: stripVisW, h: stripH, axis: 'x', maxScroll };

  const secRects = [];
  for (let s = 0; s < secCount; s++) {
    secRects.push({
      x: stripX + s * (secW + GAP) - stripScroll,
      y: stripY,
      w: secW,
      h: secH,
    });
  }
  return [mainRect, ...secRects];
}

function applyLayout() {
  const conf = document.getElementById('conference');
  const W = conf.clientWidth;
  const H = conf.clientHeight;
  const rects = calculateRects(W, H);

  for (let slot = 0; slot < positionOrder.length; slot++) {
    const playerIdx = positionOrder[slot];
    const el = containers[playerIdx];
    const r  = rects[slot];

    el.style.left   = r.x + 'px';
    el.style.top    = r.y + 'px';
    el.style.width  = r.w + 'px';
    el.style.height = r.h + 'px';

    const isMain = slot === 0;
    el.classList.toggle('is-main', isMain);

    // Clip secondary tiles to the strip viewport so scrolled tiles
    // don't bleed into the main area or the page padding.
    if (!isMain && stripBounds) {
      const top    = Math.max(0, stripBounds.y - r.y);
      const left   = Math.max(0, stripBounds.x - r.x);
      const bottom = Math.max(0, (r.y + r.h) - (stripBounds.y + stripBounds.h));
      const right  = Math.max(0, (r.x + r.w) - (stripBounds.x + stripBounds.w));
      el.style.clipPath = `inset(${top}px ${right}px ${bottom}px ${left}px)`;
    } else {
      el.style.clipPath = '';
    }

    // Show/hide mute badge
    const badge = document.getElementById(`badge-${playerIdx}`);
    if (badge) badge.style.display = isMain ? 'none' : '';
  }

  updateStripIndicator();
}

// ─────────────────────────────────────────────
// STRIP SCROLL — custom virtual scroll for the secondary tile strip.
// We can't use native overflow because all .player-container divs must
// stay siblings of #conference (DOM moves reload iframes).
// ─────────────────────────────────────────────
function updateStripIndicator() {
  const ind = document.getElementById('strip-indicator');
  if (!ind || !stripBounds || stripBounds.maxScroll <= 0) {
    if (ind) ind.style.display = 'none';
    return;
  }
  ind.style.display = 'block';
  if (stripBounds.axis === 'y') {
    const total = stripBounds.h + stripBounds.maxScroll;
    const thumbH = Math.max(24, Math.round(stripBounds.h * stripBounds.h / total));
    const thumbY = stripBounds.y + Math.round((stripBounds.h - thumbH) * (stripScroll / stripBounds.maxScroll));
    ind.style.left   = (stripBounds.x + stripBounds.w - 3) + 'px';
    ind.style.top    = thumbY + 'px';
    ind.style.width  = '3px';
    ind.style.height = thumbH + 'px';
  } else {
    const total = stripBounds.w + stripBounds.maxScroll;
    const thumbW = Math.max(24, Math.round(stripBounds.w * stripBounds.w / total));
    const thumbX = stripBounds.x + Math.round((stripBounds.w - thumbW) * (stripScroll / stripBounds.maxScroll));
    ind.style.left   = thumbX + 'px';
    ind.style.top    = (stripBounds.y + stripBounds.h - 3) + 'px';
    ind.style.width  = thumbW + 'px';
    ind.style.height = '3px';
  }
}

function pointerInStrip(clientX, clientY) {
  if (!stripBounds) return false;
  const rect = document.getElementById('conference').getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  return x >= stripBounds.x && x <= stripBounds.x + stripBounds.w
      && y >= stripBounds.y && y <= stripBounds.y + stripBounds.h;
}

function scrollStripBy(delta) {
  if (!stripBounds || stripBounds.maxScroll <= 0) return false;
  const next = Math.max(0, Math.min(stripScroll + delta, stripBounds.maxScroll));
  if (next === stripScroll) return false;
  stripScroll = next;
  applyLayout();
  return true;
}

function onWheel(e) {
  if (!pointerInStrip(e.clientX, e.clientY)) return;
  const delta = stripBounds.axis === 'y'
    ? (e.deltaY || e.deltaX)
    : (e.deltaX || e.deltaY);
  if (scrollStripBy(delta)) e.preventDefault();
}

let touchAnchor = null; // { clientX, clientY, scrollStart }

function onTouchStart(e) {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  if (!pointerInStrip(t.clientX, t.clientY)) return;
  touchAnchor = { clientX: t.clientX, clientY: t.clientY, scrollStart: stripScroll };
}

function onTouchMove(e) {
  if (!touchAnchor || !stripBounds) return;
  const t = e.touches[0];
  const delta = stripBounds.axis === 'y'
    ? touchAnchor.clientY - t.clientY
    : touchAnchor.clientX - t.clientX;
  const next = Math.max(0, Math.min(touchAnchor.scrollStart + delta, stripBounds.maxScroll));
  if (next !== stripScroll) {
    stripScroll = next;
    applyLayout();
  }
  e.preventDefault();
}

function onTouchEnd() {
  touchAnchor = null;
}

// ─────────────────────────────────────────────
// SWAP — only positionOrder changes; no DOM moves
// ─────────────────────────────────────────────
function onPlayerClick(playerIdx) {
  const currentSlot = positionOrder.indexOf(playerIdx);
  if (currentSlot === 0) return; // already main

  // Swap this player into slot 0 (main), move current main into this slot
  const prevMain = positionOrder[0];
  positionOrder[0]           = playerIdx;
  positionOrder[currentSlot] = prevMain;

  applyLayout();
  updateAudio();
}

// ─────────────────────────────────────────────
// AUDIO — main player respects mainMuted toggle;
// all secondary players are always muted
// ─────────────────────────────────────────────
function updateAudio() {
  const mainPlayerIdx = positionOrder[0];
  for (let i = 0; i < players.length; i++) {
    if (!players[i]?.mute) continue;
    if (i === mainPlayerIdx) {
      mainMuted ? players[i].mute() : players[i].unMute();
    } else {
      players[i].mute();
    }
  }
}

function toggleMainMute() {
  mainMuted = !mainMuted;
  updateAudio();
  const btn = document.getElementById('mute-btn');
  btn.textContent = mainMuted ? '🔇' : '🔊';
  btn.title       = mainMuted ? 'Unmute' : 'Mute';
}
</script>
</body>
</html>
