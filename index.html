<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Conference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Conference is a relative-positioned canvas; all players float inside it */
    #conference {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
    }

    /* Each player container is absolutely positioned; JS moves it via left/top/width/height.
       CSS transitions animate the movement so swaps look smooth instead of jarring. */
    .player-container {
      position: absolute;
      background: #161616;
      border: 1px solid #262626;
      border-radius: 0;
      overflow: hidden;
      outline: 2px solid transparent;
      outline-offset: -2px;
      transition:
        left   0.12s cubic-bezier(0.4, 0, 0.2, 1),
        top    0.12s cubic-bezier(0.4, 0, 0.2, 1),
        width  0.12s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.12s cubic-bezier(0.4, 0, 0.2, 1),
        outline-color 0.05s,
        border-color 0.05s;
    }

    .player-container.is-main {
      border-color: #0f62fe;
      outline-color: #0f62fe;
    }

    .player-container:not(.is-main):hover {
      outline-color: #0f62fe;
      border-color: #0f62fe;
    }

    /* Player wrap fills the container so the iframe resizes with it */
    .player-wrap {
      width: 100%;
      height: 100%;
    }

    .player-wrap iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: none;
    }

    /* Transparent overlay blocks all YouTube UI and captures clicks */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
    }

    .player-container.is-main > .overlay {
      cursor: default;
    }

    /* Title label at the bottom of each tile — solid charcoal bar (Carbon resists gradients) */
    .video-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 12px;
      background: #161616;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.33;
      letter-spacing: 0.32px;
      color: #ffffff;
      z-index: 12;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* Mute badge shown on secondary tiles — flat charcoal chip */
    .mute-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 13;
      font-size: 12px;
      line-height: 1;
      color: #ffffff;
      background: #161616;
      padding: 4px 6px;
      border-radius: 0;
      pointer-events: none;
    }

    /* Mute toggle — Carbon button-primary: IBM Blue, square, 12/16 padding */
    #mute-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      background: #0f62fe;
      border: 1px solid #0f62fe;
      border-radius: 0;
      color: #ffffff;
      padding: 12px 16px;
      cursor: pointer;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.29;
      letter-spacing: 0.16px;
      transition: background-color 0.11s, border-color 0.11s;
      user-select: none;
      display: none;
    }

    #mute-btn:hover { background: #0050e6; border-color: #0050e6; }
    #mute-btn:active { background: #002d9c; border-color: #002d9c; }
    #mute-btn:focus-visible {
      outline: 2px solid #0f62fe;
      outline-offset: 2px;
    }

    /* Loading / error screen — black canvas with inverse-ink type */
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #000000;
      color: #ffffff;
      z-index: 100;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.16px;
      line-height: 1.5;
    }

    #status.hidden { display: none; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #262626;
      border-top-color: #0f62fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Strip — native scroll wrapper for the secondary tile column/row.
       Sized + axis switched in JS based on landscape/portrait. */
    #strip {
      position: absolute;
      overflow: hidden;
      background: #000000;
      scrollbar-gutter: stable;
    }
    #strip.scroll-y { overflow-y: auto; overflow-x: hidden; }
    #strip.scroll-x { overflow-x: auto; overflow-y: hidden; }

    /* Carbon-style scrollbar for the strip on dark surfaces */
    #strip::-webkit-scrollbar { width: 8px; height: 8px; }
    #strip::-webkit-scrollbar-track { background: transparent; }
    #strip::-webkit-scrollbar-thumb {
      background: #393939;
      border-radius: 0;
    }
    #strip::-webkit-scrollbar-thumb:hover { background: #525252; }
    #strip { scrollbar-color: #393939 transparent; scrollbar-width: thin; }

    /* Spacer inside the strip — its size sets the scrollable extent
       so the absolutely-positioned secondary tiles can be reached. */
    #strip-spacer {
      position: relative;
      width: 1px;
      height: 1px;
    }

    /* The main slot uses position:fixed so it escapes the strip's
       overflow clipping and can sit in the main area. */
    .player-container.is-main {
      position: fixed;
    }

    /* During a swap the containing block changes (fixed↔absolute), so
       transitioning left/top/width/height would interpolate across two
       different coordinate systems and look wrong. Snap instead. */
    .swapping .player-container { transition: none !important; }
  </style>
</head>
<body>

<div id="status">
  <div class="spinner"></div>
  <span id="status-text">Loading videos…</span>
</div>

<div id="conference"></div>
<button id="mute-btn" title="Toggle mute">🔇</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const API_URL  = 'https://holotiles.stash.gentlebob.com/livestreams2';
const PAD      = 16;  // px padding around the conference area (Carbon spacing.md)
const GAP      = 8;   // px gap between tiles (Carbon spacing.xs)

// ─────────────────────────────────────────────
// MOCK — swap fetchVideos() body for a real fetch() when backend is ready.
// Expected JSON: [ { "id": "YOUTUBE_ID", "title": "..." }, … ]
// ─────────────────────────────────────────────
async function fetchVideos() {
  const res = await fetch(API_URL);
  if (!res.ok) throw new Error(`API returned ${res.status}`);
  return res.json();
}

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let videos       = [];  // [{id, title}] from API
let players      = [];  // YT.Player[i] — never reordered
let containers   = [];  // HTMLElement[i] — player wrapper divs, never reordered
let positionOrder = []; // positionOrder[slot] = playerIndex; slot 0 = main
let mainMuted    = false;
let ytReady      = false;
let pendingInit  = false;

// ─────────────────────────────────────────────
// YOUTUBE API CALLBACK
// ─────────────────────────────────────────────
window.onYouTubeIframeAPIReady = () => {
  ytReady = true;
  if (pendingInit) buildPlayers();
};

// ─────────────────────────────────────────────
// BOOTSTRAP
// ─────────────────────────────────────────────
(async () => {
  try {
    videos = await fetchVideos();
    if (!videos.length) throw new Error('No videos returned from API.');
    positionOrder = videos.map((_, i) => i); // [0, 1, 2, ...]

    if (ytReady) buildPlayers();
    else pendingInit = true;
  } catch (err) {
    document.getElementById('status-text').textContent = `Error: ${err.message}`;
    document.querySelector('.spinner').style.display = 'none';
  }
})();

// ─────────────────────────────────────────────
// BUILD DOM + PLAYERS
// All player containers live inside #strip and never move in the DOM
// (DOM moves reload iframes). The "main" slot uses position:fixed to
// escape the strip's overflow clipping; secondary slots use
// position:absolute so they ride the strip's native scroll.
// ─────────────────────────────────────────────
function buildPlayers() {
  const conf = document.getElementById('conference');

  // Strip wrapper — provides native overflow scrolling for secondary tiles
  const strip = document.createElement('div');
  strip.id = 'strip';
  const spacer = document.createElement('div');
  spacer.id = 'strip-spacer';
  strip.appendChild(spacer);
  conf.appendChild(strip);

  for (let i = 0; i < videos.length; i++) {
    // Container div — this never moves in the DOM
    const container = document.createElement('div');
    container.className = 'player-container';
    container.id = `container-${i}`;

    // Player target div
    const playerDiv = document.createElement('div');
    playerDiv.className = 'player-wrap';
    const playerTarget = document.createElement('div');
    playerTarget.id = `yt-player-${i}`;
    playerDiv.appendChild(playerTarget);
    container.appendChild(playerDiv);

    // Overlay — intercepts clicks on the YouTube iframe
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.addEventListener('click', () => onPlayerClick(i));
    container.appendChild(overlay);

    // Title label
    const label = document.createElement('div');
    label.className = 'video-label';
    label.id = `label-${i}`;
    label.textContent = videos[i].title;
    container.appendChild(label);

    // Mute badge (hidden on main)
    const badge = document.createElement('div');
    badge.className = 'mute-badge';
    badge.id = `badge-${i}`;
    badge.textContent = '🔇';
    container.appendChild(badge);

    strip.appendChild(container);
    containers.push(container);

    // Create YT player
    players.push(new YT.Player(`yt-player-${i}`, {
      width: '100%',
      height: '100%',
      videoId: videos[i].id,
      playerVars: { controls: 0, disablekb: 1, modestbranding: 1, rel: 0, autoplay: 1, mute: 1 },
      events: {
        onReady(e) { e.target.mute(); e.target.playVideo(); },
      },
    }));
  }

  // Wire up mute button
  const muteBtn = document.getElementById('mute-btn');
  muteBtn.style.display = 'block';
  muteBtn.addEventListener('click', toggleMainMute);

  // Show the conference, hide the loading screen
  document.getElementById('status').classList.add('hidden');

  // Initial layout + listen for window resize
  applyLayout();
  new ResizeObserver(applyLayout).observe(conf);
}

// ─────────────────────────────────────────────
// LAYOUT — sizes the strip wrapper, spacer, and all containers.
// Main slot = position:fixed at viewport coords (escapes strip overflow).
// Secondary slots = position:absolute in strip-content coords (ride scroll).
// ─────────────────────────────────────────────
function applyLayout() {
  const conf = document.getElementById('conference');
  const strip = document.getElementById('strip');
  const spacer = document.getElementById('strip-spacer');
  const W = conf.clientWidth;
  const H = conf.clientHeight;
  const n = videos.length;
  const secCount = n - 1;

  let mainRect, stripRect, contentW, contentH, secW, secH, axis;

  if (W >= H) {
    // Landscape: main left, secondary column scrolls vertically on the right
    const stripW = Math.round(Math.min(Math.max(W * 0.22, 160), 280));
    const mainW  = W - PAD * 2 - GAP - stripW;
    const mainH  = H - PAD * 2;
    mainRect  = { x: PAD, y: PAD, w: mainW, h: mainH };
    stripRect = { x: PAD + mainW + GAP, y: PAD, w: stripW, h: H - PAD * 2 };
    secW = stripW;
    secH = Math.round(secW * 9 / 16);
    contentW = secW;
    contentH = secCount * secH + Math.max(0, secCount - 1) * GAP;
    axis = 'y';
  } else {
    // Portrait: main top, secondary row scrolls horizontally on the bottom
    const stripH = Math.round(Math.min(Math.max(H * 0.22, 90), 180));
    const mainW  = W - PAD * 2;
    const mainH  = H - PAD * 2 - GAP - stripH;
    mainRect  = { x: PAD, y: PAD, w: mainW, h: mainH };
    stripRect = { x: PAD, y: PAD + mainH + GAP, w: W - PAD * 2, h: stripH };
    secH = stripH;
    secW = Math.round(secH * 16 / 9);
    contentW = secCount * secW + Math.max(0, secCount - 1) * GAP;
    contentH = secH;
    axis = 'x';
  }

  // Position the strip wrapper and switch its scroll axis
  strip.style.left   = stripRect.x + 'px';
  strip.style.top    = stripRect.y + 'px';
  strip.style.width  = stripRect.w + 'px';
  strip.style.height = stripRect.h + 'px';
  strip.classList.toggle('scroll-y', axis === 'y');
  strip.classList.toggle('scroll-x', axis === 'x');

  // Spacer defines the scrollable extent so absolute children are reachable
  spacer.style.width  = contentW + 'px';
  spacer.style.height = contentH + 'px';

  for (let slot = 0; slot < positionOrder.length; slot++) {
    const playerIdx = positionOrder[slot];
    const el = containers[playerIdx];
    const isMain = slot === 0;
    el.classList.toggle('is-main', isMain);

    if (isMain) {
      // position:fixed, viewport coords
      el.style.left   = mainRect.x + 'px';
      el.style.top    = mainRect.y + 'px';
      el.style.width  = mainRect.w + 'px';
      el.style.height = mainRect.h + 'px';
    } else {
      // position:absolute inside #strip's content; the secCount-1 index
      // (since slot 0 is main) maps to the slot's pixel offset.
      const s = slot - 1;
      el.style.left   = (axis === 'x' ? s * (secW + GAP) : 0) + 'px';
      el.style.top    = (axis === 'y' ? s * (secH + GAP) : 0) + 'px';
      el.style.width  = secW + 'px';
      el.style.height = secH + 'px';
    }

    // Show/hide mute badge
    const badge = document.getElementById(`badge-${playerIdx}`);
    if (badge) badge.style.display = isMain ? 'none' : '';
  }
}

// ─────────────────────────────────────────────
// SWAP — only positionOrder + CSS classes change; no DOM moves.
// The .swapping class disables transitions during the position-type
// flip (absolute↔fixed) so the snap is clean instead of glitching.
// ─────────────────────────────────────────────
function onPlayerClick(playerIdx) {
  const currentSlot = positionOrder.indexOf(playerIdx);
  if (currentSlot === 0) return; // already main

  const prevMain = positionOrder[0];
  positionOrder[0]           = playerIdx;
  positionOrder[currentSlot] = prevMain;

  const conf = document.getElementById('conference');
  conf.classList.add('swapping');
  applyLayout();
  updateAudio();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    conf.classList.remove('swapping');
  }));
}

// ─────────────────────────────────────────────
// AUDIO — main player respects mainMuted toggle;
// all secondary players are always muted
// ─────────────────────────────────────────────
function updateAudio() {
  const mainPlayerIdx = positionOrder[0];
  for (let i = 0; i < players.length; i++) {
    if (!players[i]?.mute) continue;
    if (i === mainPlayerIdx) {
      mainMuted ? players[i].mute() : players[i].unMute();
    } else {
      players[i].mute();
    }
  }
}

function toggleMainMute() {
  mainMuted = !mainMuted;
  updateAudio();
  const btn = document.getElementById('mute-btn');
  btn.textContent = mainMuted ? '🔇' : '🔊';
  btn.title       = mainMuted ? 'Unmute' : 'Mute';
}
</script>
</body>
</html>
